# Kepler configuration. Copy to kepler.toml (`kepler init` does it) and edit.
# Every value has a default in src/kepler/config.py; delete anything you don't need to change.
# Credentials come from the environment: use `uv run --env-file .env kepler run` (see .env.example).

[business]
name = "Your business"
currency = "USD"           # currently the only supported currency

[goal]
sales_per_day = 1          # the goal everything is worked back from
revenue_per_sale = 1500    # average revenue per sale, used to put a dollar value on each bottleneck

[windows]
pace_days = 7              # "per day" numbers are the average of the last N complete days
rate_days = 30             # conversion rates use the last N days (more volume, steadier rates)
lane_days = 7              # lane KPIs cover the last N complete days

# The funnel, top to bottom. Each step converts one daily metric into the next.
# benchmark = the rate you should hit; min_volume = people needed before the rate is judged.
[[funnel.steps]]
from = "impressions"
to = "clicks"
label = "Ad click-through"
benchmark = 0.015
min_volume = 2000
action = "Test new hooks and creatives."

[[funnel.steps]]
from = "clicks"
to = "optins"
label = "Click to opt-in"
benchmark = 0.30
min_volume = 100
action = "Tighten the landing page: one promise, one field, fast load."

[[funnel.steps]]
from = "optins"
to = "booked"
label = "Opt-in to booked call"
benchmark = 0.12
min_volume = 50
action = "Put the booking link in front of every new lead within minutes."

[[funnel.steps]]
from = "booked"
to = "showed"
label = "Booked to held call"
benchmark = 0.65
min_volume = 20
action = "Add reminders by text and email; confirm the day before."

[[funnel.steps]]
from = "showed"
to = "sales"
label = "Held call to sale"
benchmark = 0.25
min_volume = 20
action = "Review call recordings against your offer and objections."

[ads]
target_cpl = 25            # T, your target cost per lead
floor_multiple = 2         # under 2T spend an ad is "testing" and never cut
cut_multiple = 2           # over 2T per lead is a cut
warning_max_hours = 72     # requires continuous healthy observations; gaps over two ticks reset it
judge_days = 30            # exactly this many dates including today, also used for guard re-reads
leads_from = "ads"         # "ads" = the ad platform's lead count; "ad_leads" = a CRM CSV keyed by ad ID
# All configured CRM ad-lead exports are required; missing exports reset warnings and hold cuts.
# Successful empty exports mean zero. No platform fallback.

[auto_cut]
mode = "off"               # off | dry-run | live. Run dry-run for a while and read the Ad health page first.
source = "meta"            # the source that can re-read an ad and pause it
max_pauses_per_run = 3     # more candidates than this at once = hold everything
max_snapshot_age_minutes = 20  # both checking modes also require healthy ad and selected lead sources
spend_tolerance = 1.0      # hold if the snapshot's spend is over the fresh read by more than this
max_cpm = 500              # hold if cost per 1,000 impressions is above this (impossible numbers)

[analysis]
enabled = false            # needs `uv sync --extra llm` and ANTHROPIC_API_KEY
every_minutes = 1440       # at most one attempt per day, including failures and interruptions; no SDK retries
model = "claude-opus-5-5"
effort = "low"

[paths]
state = "state"            # cache, snapshot.json, logs (keep out of git)
site = "site"              # generated HTML


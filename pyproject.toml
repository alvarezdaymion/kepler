[project]
name = "kepler"
version = "0.1.0"
description = "Revenue dashboard: goal-backed funnel, bottlenecks ranked by revenue at stake, a 15-minute read-only controller and a guarded ad auto-cut."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daymion Alvarez" }]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]

[project.scripts]
kepler = "kepler.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kepler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]
